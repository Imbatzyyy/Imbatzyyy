<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Prince Balane, Full-Stack and Mobile Developer</title>
  <desc id="desc">A dark geometric banner with orange and teal accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.56" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#07151a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1075" cy="42" r="150" fill="#2dd4bf" fill-opacity=".08"/>
  <circle cx="1040" cy="75" r="62" fill="#2dd4bf" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="80" cy="284" r="170" fill="#ff7a45" fill-opacity=".08"/>
  <path d="M925 0 1200 0 1200 116 1138 116 1088 66 990 66Z" fill="#ffffff" fill-opacity=".025"/>
  <path d="m970 214 66-66 66 66-66 66Z" fill="none" stroke="#2dd4bf" stroke-opacity=".24" stroke-width="2"/>
  <path d="m1020 214 16-16 16 16-16 16Z" fill="#ff7a45"/>
  <rect x="80" y="66" width="76" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="80" y="142" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="760" letter-spacing="-1.6">PRINCE BALANE</text>
  <text x="82" y="191" fill="#b7c3d4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500" letter-spacing="2.2">FULL-STACK  /  MOBILE  /  SECURITY-FOCUSED</text>
  <text x="82" y="238" fill="#7f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Building dependable products across web, mobile, and backend.</text>
  <rect x="80" y="270" width="1040" height="3" rx="1.5" fill="url(#accent)" fill-opacity=".82"/>
</svg>
